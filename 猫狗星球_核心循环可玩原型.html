<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>猫狗星球 · 核心循环可玩原型 (v0.1 乐趣假设验证)</title>
<link rel="stylesheet" href="猫狗星球_核心循环可玩原型.css" />
</head>
<body>
<div id="preSplash" style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.35)),url('猫狗星球_载入画面.webp') center/cover no-repeat;z-index:9999;overflow:hidden">
  <div style="padding-top:64px;text-align:center;position:relative;z-index:1">
    <div style="font-size:24px;color:#fff;opacity:.85;letter-spacing:14px;margin-bottom:6px">✦ ─ ✦</div>
    <img class="brand-title-art" src="猫狗星球_登录气泡标题.webp" alt="猫狗星球">
    <div style="font-size:14px;color:#fff8ec;letter-spacing:3px;margin-top:6px">— 和旅伴一起环游世界 —</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;z-index:1;padding-bottom:80px">
    <div style="width:180px;height:3px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin:14px 0"><div id="preBar" style="height:100%;width:0%;background:linear-gradient(90deg,#fff5d6,#ffe4a3);border-radius:4px;transition:width .15s"></div></div>
    <div style="text-align:center"><button id="preStart" style="background:linear-gradient(135deg,#7fb3a3,#5a9b8a);color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:24px;padding:14px 48px;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:3px;box-shadow:0 8px 24px rgba(0,0,0,.25)">开始冒险</button></div>
  </div>
</div>
<div id="app" style="display:none">
  <header>
    <div class="top-row">
      <div class="avatar" id="hAvatar">🐱</div>
      <div class="who">
        <div class="nm"><span id="hName">我的旅伴</span> <span id="hLvTitle" class="lvtitle"></span></div>
        <div class="st" id="hStatus">在家休息中</div>
      </div>
      <button id="petSwitchBtn" class="mini-btn" style="margin-left:auto;flex-shrink:0;font-size:12px;white-space:nowrap" title="切换宠物角色">🐾 角色</button>
    </div>
    <div class="res">
      <span class="pill"><img class="ui-ic" src="猫狗星球_图标美术/star.webp" alt=""> 星屑 <b id="rStar">0</b></span>
      <span class="pill"><img class="ui-ic" src="猫狗星球_图标美术/food.webp" alt=""> 干粮 <b id="rFood">5</b></span>
      <span class="pill"><img class="ui-ic" src="猫狗星球_图标美术/crystal.webp" alt=""> 残片 <b id="rFrag">0</b></span>
      <span class="pill"><img class="ui-ic" src="猫狗星球_图标美术/map.webp" alt=""> 藏宝图 <b id="rMap">0</b></span>
      <span class="pill"><img class="ui-ic" src="猫狗星球_图标美术/backpack.webp" alt=""> 背包 <b id="rBackpack">0/20</b></span>
    </div>
  </header>

  <main id="main"><!-- dynamic --></main>

  <nav>
    <button data-view="home" class="on"><span class="ic"><img class="ui-ic" src="猫狗星球_图标美术/home.webp" alt=""></span>家</button>
    <button data-view="codex"><span class="ic"><img class="ui-ic" src="猫狗星球_图标美术/book.webp" alt=""></span>图鉴</button>
    <button data-view="journal"><span class="ic"><img class="ui-ic" src="猫狗星球_图标美术/journal.webp" alt=""></span>手账</button>
    <button data-view="social"><span class="ic"><img class="ui-ic" src="猫狗星球_图标美术/social.webp" alt=""></span>互送</button>
    <button data-view="wardrobe"><span class="ic"><img class="ui-ic" src="猫狗星球_图标美术/wardrobe.webp" alt=""></span>衣橱</button>
    <button data-view="shop"><span class="ic"><img class="ui-ic" src="猫狗星球_图标美术/shop.webp" alt=""></span>星屑</button>
    <button data-view="tune"><span class="ic"><img class="ui-ic" src="猫狗星球_图标美术/tune.webp" alt=""></span>调参</button>
  </nav>
</div>

<!-- return modal -->
<div class="mask" id="returnMask"><div class="sheet" id="returnSheet"></div></div>
<!-- generic modal -->
<div class="mask" id="genMask"><div class="sheet" id="genSheet"></div></div>
<div class="toast" id="toast"></div>

<script src="猫狗星球_核心循环可玩原型.js"></script>
</body>
</html>
